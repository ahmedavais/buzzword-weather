name: Record data

on:
  workflow_call:
    inputs:
      record:
        description: Commands that record the data file, run before the tests
        required: true
        type: string
      file:
        description: The recorded data file
        required: true
        type: string
      branch:
        description: The branch that carries the change, reused while its pull request is open
        required: true
        type: string
      title:
        description: The commit message and pull request title
        required: true
        type: string
      then:
        description: Commands to run after proposing the data file, still as the data bot
        required: false
        type: string
        default: ""
    secrets:
      DATA_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      FILE: ${{ inputs.file }}
      BRANCH: ${{ inputs.branch }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: data-bot
        with:
          client-id: ${{ vars.DATA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.data-bot.outputs.token }}
      - name: Commit as the data bot
        env:
          GH_TOKEN: ${{ steps.data-bot.outputs.token }}
          APP_SLUG: ${{ steps.data-bot.outputs.app-slug }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)+$APP_SLUG[bot]@users.noreply.github.com"
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Record
        shell: bash
        env:
          GH_TOKEN: ${{ steps.data-bot.outputs.token }}
        run: ${{ inputs.record }}
      - name: Check the data before proposing it
        run: uv run pytest
      - name: Propose the data in a pull request that merges itself once CI passes
        env:
          GH_TOKEN: ${{ steps.data-bot.outputs.token }}
        run: |
          if git diff --quiet -- "$FILE"; then
            echo "$FILE is already up to date"
            exit 0
          fi
          git switch -q -C "$BRANCH"
          git add "$FILE"
          git commit -qm "$TITLE"
          git push -q --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "$TITLE" \
              --body "Recorded by the \"${{ github.workflow }}\" workflow. It merges itself once CI passes."
          fi
          gh pr merge "$BRANCH" --auto --squash
      - name: Then
        if: inputs.then != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.data-bot.outputs.token }}
        run: ${{ inputs.then }}
