name: Record the weekly words

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: record-weekly-words

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Check the Hacker News search still answers as expected
        run: uv run pytest -m integration
      - run: uv run python record_weekly_words.py
      - name: Remember the candidates whose pull requests were closed without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh pr list --state closed --limit 1000 --json headRefName,mergedAt \
            --jq '.[] | select(.mergedAt == null) | .headRefName | select(startswith("candidate/")) | ltrimstr("candidate/")' \
            | xargs -r uv run python pass_over.py
      - name: Check the weekly words before committing them
        run: uv run pytest
      - name: Commit the weekly words if they changed
        run: |
          if git diff --quiet -- weekly_words.json; then
            echo "The weekly words are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_words.json
          git commit -m "chore: Record the weekly words"
          git push

  propose:
    needs: record
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - name: Open a pull request for each new candidate buzzword
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python find_candidates.py > candidates.jsonl
          while IFS= read -r candidate; do
            phrase=$(jq -r .phrase <<< "$candidate")
            name=$(jq -r .name <<< "$candidate")
            branch="candidate/$(jq -r .slug <<< "$candidate")"
            if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
              echo "Already proposed $name"
              continue
            fi
            git checkout -q -B "$branch" "origin/${{ github.ref_name }}"
            uv run python add_candidate.py "$phrase"
            uv run pytest -q
            git commit -qam "feat: Add $name to the catalog as a rising buzzword"
            git push -q --force origin "$branch"
            jq -r .body <<< "$candidate" > body.md
            gh pr create --head "$branch" --base "${{ github.ref_name }}" --title "feat: Add $name to the catalog" --body-file body.md
          done < candidates.jsonl
