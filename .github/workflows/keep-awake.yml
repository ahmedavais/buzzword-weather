name: Keep the app awake

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --only-group keep-awake
      - name: Install Chromium, trying again when Ubuntu's package servers don't answer
        run: |
          for attempt in 1 2 3; do
            if uv run --no-sync playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Installing Chromium failed on try $attempt"
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1
      - run: uv run --no-sync python keep_awake.py
