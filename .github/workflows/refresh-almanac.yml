name: Refresh the almanac

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    uses: ./.github/workflows/record-data.yml
    with:
      record: uv run python record_almanac.py
      file: almanac.json
      branch: data/almanac
      title: "chore: Refresh the almanac"
    secrets: inherit
