name: Refresh the almanac

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: data-bot
        with:
          client-id: ${{ vars.DATA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.data-bot.outputs.token }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run python record_almanac.py
      - name: Check the almanac before committing it
        run: uv run pytest
      - name: Propose the almanac if it changed
        uses: ./.github/actions/propose-data-change
        with:
          token: ${{ steps.data-bot.outputs.token }}
          app-slug: ${{ steps.data-bot.outputs.app-slug }}
          file: almanac.json
          branch: data/almanac
          title: "chore: Refresh the almanac"
