name: Propose a data change
description: Opens a pull request for a recorded data file that changed, set to merge itself once CI passes

inputs:
  token:
    description: The data bot's installation token
    required: true
  app-slug:
    description: The data bot's slug, which names its commit author
    required: true
  file:
    description: The recorded data file
    required: true
  branch:
    description: The branch that carries the change, reused while its pull request is open
    required: true
  title:
    description: The commit message and pull request title
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ inputs.app-slug }}
        FILE: ${{ inputs.file }}
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        if git diff --quiet -- "$FILE"; then
          echo "$FILE is already up to date"
          exit 0
        fi
        bot_id=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)
        git config user.name "$APP_SLUG[bot]"
        git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
        git switch -q -C "$BRANCH"
        git add "$FILE"
        git commit -qm "$TITLE"
        git push -q --force origin "$BRANCH"
        if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
          gh pr create --head "$BRANCH" --title "$TITLE" \
            --body "Recorded by the \"$WORKFLOW\" workflow. It merges itself once CI passes."
        fi
        gh pr merge "$BRANCH" --auto --squash
