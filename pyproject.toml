[project]
name = "buzzword-weather"
version = "0.1.0"
description = "Engineering buzzwords and their weather, from Hacker News mentions"
authors = [
    { name = "Ahmed Avais", email = "ahmed@ahmedavais.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
keep-awake = [
    "playwright>=1.64.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["*_test.py"]
addopts = "-m 'not integration'"
markers = ["integration: talks to the real Hacker News search API"]

[tool.ruff]
line-length = 120
extend-exclude = ["playground"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
